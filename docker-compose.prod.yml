# OrçaPro — stack de produção (tudo em um único servidor/VPS)
# Uso:
#   cp .env.prod.example .env.prod   # edite os valores
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy serve HTTPS (Let's Encrypt) e roteia:
#   /        -> frontend (SPA Vue)
#   /api/*   -> backend Go (Fiber)
#   /uploads/* -> backend Go
#
# Portas expostas na rede: 80 e 443. Postgres/Redis não são expostos.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      CORS_ORIGIN: "https://${DOMAIN}"
      PUBLIC_BASE_URL: "https://${DOMAIN}"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis:6379"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
